[package]
name = "viewlake"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.52", features = ["Win32_Networking_WinHttp", "Win32_Foundation"] }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
logging = []
